[project]
name = "gis-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fiona>=1.10.1",
    "geobr>=1.0.0",
    "geopandas>=1.0.0,<=1.1.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psutil>=7.2.2",
    "shapely>=2.0.0,<2.1.1",
]

[project.scripts]
gis-python = "gis_python:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
